name: Build Silent Preparation Hub APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Assets
        run: |
          npm install --legacy-peer-deps || npm install --force
          npm run build || npx vite build

      - name: Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sph.prepapp",
            "appName": "Silent Preparation Hub",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Force Custom SPH App Icon on All Android Versions
        run: |
          ICON_PATH=$(find public/ -maxdepth 1 -type f \( -iname "*icon*" -o -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) | head -n 1)

          if [ -n "$ICON_PATH" ] && [ -f "$ICON_PATH" ]; then
            echo "Found Icon File at: $ICON_PATH"
            
            # Remove anydpi-v26 folder so modern Android is forced to use the new 3D logo
            rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true

            for density in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              name="${density%%:*}"
              size="${density##*:}"
              mkdir -p "android/app/src/main/res/mipmap-${name}"
              convert "$ICON_PATH" -resize "${size}x${size}" "android/app/src/main/res/mipmap-${name}/ic_launcher.png" || true
              convert "$ICON_PATH" -resize "${size}x${size}" "android/app/src/main/res/mipmap-${name}/ic_launcher_round.png" || true
              convert "$ICON_PATH" -resize "${size}x${size}" "android/app/src/main/res/mipmap-${name}/ic_launcher_foreground.png" || true
            done
            echo "SPH 3D Icons successfully applied to all layers!"
          fi

      - name: Fix Duplicate Kotlin Libraries
        run: |
          cat << 'EOF' >> android/app/build.gradle
          configurations.all {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPH-Silent-Preparation-Hub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
