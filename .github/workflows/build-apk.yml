name: Build Silent Preparation Hub APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Assets
        run: |
          npm install --legacy-peer-deps || npm install --force
          npm run build || npx vite build

      - name: Configure Capacitor & Google Services Engine
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sph.silentprep",
            "appName": "Silent Preparation Hub",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

          # Copy google-services.json
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          elif [ -f "public/google-services.json" ]; then
            cp public/google-services.json android/app/google-services.json
          fi

          # Safely inject Google Services Plugin into Gradle using Python
          python3 - << 'EOF'
          import os

          # 1. Update root build.gradle
          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              with open(root_gradle, 'r') as f:
                  content = f.read()
              if 'com.google.gms:google-services' not in content:
                  content = content.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
                  with open(root_gradle, 'w') as f:
                      f.write(content)

          # 2. Update app build.gradle
          app_gradle = 'android/app/build.gradle'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r') as f:
                  app_content = f.read()
              if 'com.google.gms.google-services' not in app_content:
                  app_content += "\ntry {\n    def servicesJSON = file('google-services.json')\n    if (servicesJSON.text) {\n        apply plugin: 'com.google.gms.google-services'\n    }\n} catch(Exception e) {\n    logger.warn('google-services.json missing')\n}\n"
                  with open(app_gradle, 'w') as f:
                      f.write(app_content)

          print("Google Services Plugin Successfully Connected to Android Core!")
          EOF

      - name: Generate SPH HD Icons with Python Engine
        run: |
          python3 -m pip install --upgrade Pillow
          python3 - << 'EOF'
          import os, shutil
          from PIL import Image

          icon_path = 'app-icon.png'
          if not os.path.exists(icon_path):
              icon_path = 'public/app-icon.png'

          print(f"Loading SPH Logo from: {icon_path}")
          img = Image.open(icon_path).convert('RGBA')

          densities = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          res_dir = 'android/app/src/main/res'
          anydpi = os.path.join(res_dir, 'mipmap-anydpi-v26')
          if os.path.exists(anydpi):
              shutil.rmtree(anydpi)

          for folder, size in densities.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              for name in ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']:
                  resized.save(os.path.join(target_dir, name), 'PNG')

          print("100% SPH HD Icons Created Successfully!")
          EOF

      - name: Fix Duplicate Kotlin Libraries
        run: |
          cat << 'EOF' >> android/app/build.gradle
          configurations.all {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
          EOF

      - name: Build Official Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Verified Safe APK
        uses: actions/upload-artifact@v4
        with:
          name: SPH-Silent-Preparation-Hub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
