name: Build Silent Preparation Hub APK & Web App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Assets (For App & Laptop Web)
        run: |
          npm install --legacy-peer-deps || npm install --force
          npm run build || npx vite build
          cp -r public/* dist/ 2>/dev/null || true

      - name: Deploy to GitHub Pages (For Laptop & iPhone Web App)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Configure Capacitor & Native Google Services Engine
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/push-notifications --legacy-peer-deps
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sph.silentprep",
            "appName": "Silent Preparation Hub",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

          # 1. Place google-services.json inside android/app/
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          elif [ -f "public/google-services.json" ]; then
            cp public/google-services.json android/app/google-services.json
          fi

          # 2. Inject Google Services & Firebase Dependencies into Gradle
          python3 - << 'EOF'
          import os

          # Root build.gradle
          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              with open(root_gradle, 'r') as f:
                  c = f.read()
              if 'com.google.gms:google-services' not in c:
                  c = c.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
                  with open(root_gradle, 'w') as f:
                      f.write(c)

          # App build.gradle
          app_gradle = 'android/app/build.gradle'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r') as f:
                  app_c = f.read()
              if 'com.google.gms.google-services' not in app_c:
                  app_c += "\napply plugin: 'com.google.gms.google-services'\n"
                  with open(app_gradle, 'w') as f:
                      f.write(app_c)

          # Add POST_NOTIFICATIONS permission to AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  m_c = f.read()
              if 'POST_NOTIFICATIONS' not in m_c:
                  m_c = m_c.replace('<application', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application')
                  with open(manifest_path, 'w') as f:
                      f.write(m_c)

          print("Firebase Native Push Engine Configured 100% Successfully!")
          EOF

      - name: Generate SPH HD Icons with Python Engine
        run: |
          python3 -m pip install --upgrade Pillow
          python3 - << 'EOF'
          import os, shutil
          from PIL import Image

          icon_path = 'app-icon.png'
          if not os.path.exists(icon_path):
              icon_path = 'public/app-icon.png'

          print(f"Loading SPH Logo from: {icon_path}")
          img = Image.open(icon_path).convert('RGBA')

          densities = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          res_dir = 'android/app/src/main/res'
          anydpi = os.path.join(res_dir, 'mipmap-anydpi-v26')
          if os.path.exists(anydpi):
              shutil.rmtree(anydpi)

          for folder, size in densities.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              for name in ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']:
                  resized.save(os.path.join(target_dir, name), 'PNG')

          print("100% SPH HD Icons Created Successfully!")
          EOF

      - name: Fix Duplicate Kotlin Libraries
        run: |
          cat << 'EOF' >> android/app/build.gradle
          configurations.all {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
          EOF

      - name: Build Official Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Verified Safe APK
        uses: actions/upload-artifact@v4
        with:
          name: SPH-Silent-Preparation-Hub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
