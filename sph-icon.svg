<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer Shield Gradient: Royal Blue to Vibrant Emerald -->
    <linearGradient id="sphShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2563EB" />
      <stop offset="55%" stopColor="#059669" />
      <stop offset="100%" stopColor="#047857" />
    </linearGradient>

    <!-- Accent Gold/Amber Gradient -->
    <linearGradient id="sphGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <!-- Core Crisp Clean Background -->
    <linearGradient id="sphCoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#F8FAFC" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <radialGradient id="sphGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stopColor="#2563EB" stopOpacity="0.18" />
      <stop offset="100%" stopColor="#059669" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Rounded Container Backdrop for Adaptive Android Icon Launcher -->
  <rect width="100" height="100" rx="22" fill="#0F172A" />

  <!-- Background Ambient Glow -->
  <circle cx="50" cy="50" r="44" fill="url(#sphGlow)" />

  <!-- Outer Shield Border -->
  <path
    d="M50 10 L82 23 C82 53 68 76 50 89 C32 76 18 53 18 23 L50 10 Z"
    fill="url(#sphShieldGrad)"
    stroke="#FFFFFF"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Inner Shield Body -->
  <path
    d="M50 16 L76 27 C76 51 64 71 50 82 C36 71 24 51 24 27 L50 16 Z"
    fill="url(#sphCoreGrad)"
    stroke="#E2E8F0"
    stroke-width="1"
  />

  <!-- Academic Laurel / Crest Arc -->
  <path
    d="M33 46 C33 59 40 68 50 72 C60 68 67 59 67 46"
    stroke="url(#sphShieldGrad)"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-dasharray="2 3"
  />

  <!-- Open Book Foundation -->
  <path
    d="M36 63 C42 60 46 61 50 64 C54 61 58 60 64 63 L64 66 C58 63 54 64 50 67 C46 64 42 63 36 66 Z"
    fill="url(#sphShieldGrad)"
    opacity="0.95"
  />

  <!-- Central Monogram: S P H -->
  <text
    x="50"
    y="47"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#0F172A"
    font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif"
    font-weight="900"
    font-size="17"
    letter-spacing="0.6"
  >
    SPH
  </text>

  <!-- Top Star Accent -->
  <polygon
    points="50,19 52,23 56,23 53,25 54,29 50,26 46,29 47,25 44,23 48,23"
    fill="url(#sphGoldGrad)"
  />
</svg>
